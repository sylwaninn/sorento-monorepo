name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read the code and nothing else. A job that needs more widens it for itself.
permissions:
  contents: read

# Job names carry a prefix so the list of checks on a pull request reads as a pyramid rather than
# as seven unrelated lines: what is static, what each test layer asserts, what ships, what is
# scanned. A red cross should say which of those broke before anyone opens it.
#
# Every job also carries a timeout. GitHub's default is six hours, and the two jobs that start a
# database are exactly the ones that can hang without ever failing.

jobs:
  check:
    name: "check: format, lint, types, docs"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          deno: "true"

      # Runs before lint: an unformatted file is the cheapest failure to diagnose.
      - name: Check formatting
        run: pnpm format:check

      # Structural audit of the suites: an orphan test, a module with none, a `.only`, an Edge
      # Function no case names, a journey's French copy its dictionary no longer contains. Runs
      # no test, so it reports in seconds and before anything slower has a chance to fail first.
      - name: Audit the test suites
        run: pnpm check:tests

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Deno, plus the import-map guard that keeps every Edge Function bootable.
      - name: Lint and typecheck Edge Functions
        run: pnpm check:functions

      # The README's generated blocks (badges, packages, commands, functions, env vars)
      # must match the tree. `pnpm sync:docs` regenerates them.
      - name: Check documentation freshness
        run: pnpm check:docs

  test-unit:
    # The Edge Function suite runs here rather than in a job of its own because it emits the lcov
    # the diff-coverage step below reads, and an artifact handed between two jobs would be a
    # slower way to say the same thing.
    name: "test: unit and edge functions"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # check-diff-coverage compares against the base branch, which needs its history.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          deno: "true"

      # The shared code every function runs before anything else: token hashing, the cron secret
      # comparison, CORS, payload parsing, the email bodies and the gate on the development
      # endpoints.
      - name: Test the shared Edge Function code
        run: pnpm test:functions

      # Fails on its own if any package falls under its threshold. The gate lives in the
      # vitest configs, not here, so `pnpm verify` locally enforces exactly the same bar.
      - name: Unit tests with coverage thresholds
        run: pnpm test:coverage

      # A global percentage barely moves when a hundred untested lines land in a large
      # repository. This asks the question that does not average away: are the lines this
      # branch changed covered?
      - name: Coverage of the changed lines
        if: github.event_name == 'pull_request'
        run: pnpm coverage:diff

      # Coverage that has run ahead of its threshold is slack a later regression hides in.
      - name: Coverage thresholds still pressed to what is achieved
        run: pnpm coverage:ratchet:check

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage
            apps/*/coverage
            supabase/coverage
          retention-days: 7
          if-no-files-found: ignore

  test-integration:
    # Split from the journeys, which it used to share a job with. The two need the same database
    # and nothing else: one asks whether the policies refuse the right people, the other whether
    # a person can get through the app. Grouping them by the infrastructure they happen to share
    # meant one red cross for two unrelated failures, and reading the step log to tell which.
    name: "test: integration (database, policies, jobs)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Pinned: `latest` turned a Supabase release into a red build nobody had committed for.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      # The functions read their secrets from supabase/functions/.env, which is gitignored, so a
      # fresh checkout has none and every cron-guarded job answers 401. Not a credential: it
      # guards a stack that lives for the length of this job, and it matches the value
      # e2e/support/env.ts falls back to. APP_ENV stays out, so the development-only endpoints
      # remain shut here exactly as they are on a deployed environment.
      - name: Write the function environment the local stack needs
        run: echo "CRON_SECRET=local-dev-cron-secret" > supabase/functions/.env

      # Replays every migration from nothing and seeds. A migration that only applies on top of
      # an existing database fails here rather than on the next developer's machine.
      - name: Start Supabase
        run: supabase start

      # RLS policies, the policy snapshot, the SQL-to-TypeScript mirrors, the thirteen Edge
      # Functions over real HTTP, and the scheduled jobs asserted on what they leave behind.
      - name: Integration tests
        run: pnpm test:integration

      - name: Stack state on failure
        if: failure()
        run: supabase status || true

  test-journeys:
    name: "test: journeys (browser)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Write the function environment the local stack needs
        run: echo "CRON_SECRET=local-dev-cron-secret" > supabase/functions/.env

      - name: Start Supabase
        run: supabase start

      - name: Install Playwright browser
        run: pnpm --filter @sorento/e2e exec playwright install --with-deps chromium

      # Every screen the route table declares, driven through a production build in a real
      # browser: the funnel, the account lifecycle through the local mailbox, a dossier worked
      # end to end, sharing it, the trusted contact, the public pages and the back office.
      - name: End-to-end journeys
        run: pnpm test:e2e

      - name: Upload journey report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Stack state on failure
        if: failure()
        run: supabase status || true

  test-mutation:
    # Coverage says a line ran; the mutation score says an assertion would have caught it
    # changing. Only the two pure packages are mutated: they have no DOM and no I/O, so the whole
    # run is seconds, and they are where the rules live.
    name: "test: mutation (core, domain)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Each package breaks the build under its own threshold, set in its stryker.config.json.
      - name: Mutation testing
        run: pnpm test:mutation

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: packages/*/reports/mutation
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

  security:
    name: "security: secret scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks lists the commits of the pull request through the API before scanning them.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs the history to scan the commits a PR adds, not just the tree.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A leak already fails the job. Commenting on top would need write access.
          GITLEAKS_ENABLE_COMMENTS: false
