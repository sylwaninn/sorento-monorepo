<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      No viewport-fit=cover on purpose. Safari 26 extends the document behind its translucent
      toolbars when a page opts into cover, so the content scrolls visibly through the browser
      chrome. The default keeps the document below the bars, and the safe-area tokens in
      index.css fall back to 0px, which is exactly right once nothing sits under the notch.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Sessions are kept in localStorage (see SECURITY.md), so an XSS would be enough to
      exfiltrate an access token. This policy is the main compensation: no eval, no
      third-party script origin, and no way to frame or hijack the document.
      style-src keeps 'unsafe-inline' because the styling layer injects style elements at
      runtime; script-src deliberately does not.
      Prefer serving the same policy as a response header in production: a meta tag cannot
      express frame-ancestors to every browser, and a header is not editable by an injection.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob:;
               font-src 'self' data:;
               connect-src 'self' https://*.supabase.co wss://*.supabase.co http://127.0.0.1:57321 ws://127.0.0.1:57321;
               frame-ancestors 'none';
               object-src 'none';
               base-uri 'self';
               form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light" />
    <!-- Matches --brand-cream, the body ground. Chrome on Android colours its bar with this;
         Safari 26 ignores the tag entirely and samples fixed elements instead, which is what
         BrowserChromeTint is for. -->
    <meta name="theme-color" content="#f5f6f2" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta
      name="description"
      content="Après un décès, Sorento vous accompagne : parcours clair, aides à vérifier, courriers prêts à relire et suivi partagé. Gratuit pour les familles."
    />
    <meta name="author" content="Sorento" />
    <meta property="og:title" content="Sorento · Les démarches après un décès, dans le bon ordre" />
    <meta
      property="og:description"
      content="Un parcours personnalisé et gratuit pour savoir quoi faire, vérifier les aides possibles et avancer avec ses proches."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sorento" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Sorento, après un décès, un chemin clair pour vous et vos proches."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Sorento · Les démarches après un décès, dans le bon ordre"
    />
    <meta
      name="twitter:description"
      content="Un parcours personnalisé et gratuit pour savoir quoi faire, vérifier les aides possibles et avancer avec ses proches."
    />
    <meta name="twitter:image" content="/og.jpg" />
    <meta
      name="twitter:image:alt"
      content="Sorento, après un décès, un chemin clair pour vous et vos proches."
    />
    <!--
      The hero photograph is the largest thing the first screen paints, and the browser cannot
      find it until React has mounted, so it is asked for here instead. The two candidate lists
      have to be the ones the element itself will use, or the preload picks a different file and
      the page downloads the photograph twice. presentation.test.ts compares them against
      landingPictures.hero and fails on a drift of a single character.
    -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-sorento-1280.avif"
      type="image/avif"
      imagesrcset="/images/hero-sorento-768.avif 768w, /images/hero-sorento-1280.avif 1280w, /images/hero-sorento-1728.avif 1728w"
      imagesizes="(max-width: 767px) 100vw, min(88rem, calc(100vw - 2.5rem))"
      fetchpriority="high"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Sorento · Les démarches après un décès, dans le bon ordre</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
