<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      No viewport-fit=cover on purpose. Safari 26 extends the document behind its translucent
      toolbars when a page opts into cover, so the content scrolls visibly through the browser
      chrome. The default keeps the document below the bars, and the safe-area tokens in
      index.css fall back to 0px, which is exactly right once nothing sits under the notch.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Sessions are kept in localStorage (see SECURITY.md), so an XSS would be enough to
      exfiltrate an access token. This policy is the main compensation: no eval, no
      third-party script origin, and no way to frame or hijack the document.
      style-src keeps 'unsafe-inline' because the styling layer injects style elements at
      runtime; script-src deliberately does not.
      Prefer serving the same policy as a response header in production: a meta tag cannot
      express frame-ancestors to every browser, and a header is not editable by an injection.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob:;
               font-src 'self' data:;
               connect-src 'self' https://*.supabase.co wss://*.supabase.co http://127.0.0.1:57321 ws://127.0.0.1:57321;
               frame-ancestors 'none';
               object-src 'none';
               base-uri 'self';
               form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light" />
    <!-- Matches --brand-cream, the body ground. Chrome on Android colours its bar with this;
         Safari 26 ignores the tag entirely and samples fixed elements instead, which is what
         BrowserChromeTint is for. -->
    <meta name="theme-color" content="#f5f6f2" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Sorento</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
